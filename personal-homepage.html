<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一页自然、空旷、可编辑的双语个人主页">
  <title>Personal Homepage</title>
  <style>
    :root {
      --ink: #18312d;
      --muted: #58716a;
      --line: rgba(31, 66, 58, .15);
      --glass: rgba(255, 255, 255, .68);
      --glass-strong: rgba(255, 255, 255, .84);
      --accent: #2f7060;
      --accent-soft: #dcebe3;
      --shadow: 0 24px 70px rgba(36, 70, 62, .12);
      --radius: 28px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #eaf3ef;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }

    .landscape {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 70% 13%, rgba(255,255,255,.95) 0 3%, transparent 18%),
        linear-gradient(180deg, #eff8f7 0%, #e7f2ef 46%, #dbe9df 100%);
    }
    .px {
      position: absolute; inset: 0;
      will-change: transform;
    }
    .px-sun { z-index: 1; } .px-mist1 { z-index: 2; } .px-mist2 { z-index: 2; }
    .px-far { z-index: 3; } .px-mid { z-index: 4; } .px-near { z-index: 5; }
    .grain { z-index: 6; }
    .sun {
      position: absolute;
      top: 11%; right: 14%;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255, 250, 217, .58);
      filter: blur(3px);
      box-shadow: 0 0 90px rgba(255, 246, 199, .65);
    }
    .mist {
      position: absolute;
      width: 56vw; height: 20vw;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      filter: blur(24px);
    }
    .mist.one { left: -8vw; top: 28%; transform: rotate(-5deg); }
    .mist.two { right: -12vw; top: 47%; transform: rotate(7deg); opacity: .7; }
    .ridge {
      position: absolute;
      left: -8%; right: -8%;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      transform-origin: center bottom;
      transition: opacity .8s ease, transform .8s cubic-bezier(.76, 0, .24, 1);
      will-change: transform, opacity;
    }
    /* 滚轮切换翻页时：山峦逐层向两侧“打开”退场，露出下一页 */
    .landscape.switching .ridge.far  { animation: ridgeOpenLeft  .85s cubic-bezier(.76,0,.24,1)         forwards; }
    .landscape.switching .ridge.mid  { animation: ridgeOpenRight .85s cubic-bezier(.76,0,.24,1) .14s     forwards; }
    .landscape.switching .ridge.near { animation: ridgeOpenLeft  .85s cubic-bezier(.76,0,.24,1) .28s     forwards; }
    .landscape.switching .sun  { animation: sunLift   .85s ease .1s forwards; }
    .landscape.switching .mist.one { animation: mistDriftOne .85s ease .18s forwards; }
    .landscape.switching .mist.two { animation: mistDriftTwo .85s ease .18s forwards; }
    @keyframes ridgeOpenLeft {
      0%   { opacity: var(--op, .68); transform: none; }
      55%  { opacity: calc(var(--op, .68) * .4); transform: translateX(-16%) scaleX(1.08); }
      100% { opacity: 0; transform: translateX(-46%) scaleX(1.22); }
    }
    @keyframes ridgeOpenRight {
      0%   { opacity: var(--op, .82); transform: none; }
      55%  { opacity: calc(var(--op, .82) * .4); transform: translateX(16%) scaleX(1.08); }
      100% { opacity: 0; transform: translateX(46%) scaleX(1.22); }
    }
    @keyframes sunLift { to { transform: translateY(-30px) scale(1.06); opacity: .42; } }
    @keyframes mistDriftOne { to { transform: rotate(-5deg) translateX(26vw); opacity: .25; } }
    @keyframes mistDriftTwo { to { transform: rotate(7deg) translateX(-22vw); opacity: .2; } }
    .ridge.far {
      bottom: 12%; height: 35%;
      --op: .68;
      background: #c7ddd4;
      clip-path: polygon(0 48%, 9% 36%, 20% 47%, 34% 22%, 47% 51%, 61% 30%, 73% 44%, 86% 18%, 100% 40%, 100% 100%, 0 100%);
      opacity: var(--op);
    }
    .ridge.mid {
      bottom: -1%; height: 33%;
      --op: .82;
      background: #aac9b8;
      clip-path: polygon(0 42%, 14% 22%, 27% 43%, 43% 18%, 56% 40%, 70% 29%, 84% 9%, 100% 31%, 100% 100%, 0 100%);
      opacity: var(--op);
    }
    .ridge.near {
      bottom: -14%; height: 34%;
      --op: 1;
      background: linear-gradient(180deg, #7fa88f, #628976);
      clip-path: ellipse(72% 64% at 50% 70%);
      opacity: var(--op);
    }
    .grain {
      position: absolute; inset: 0; opacity: .06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    .site-header {
      position: fixed;
      z-index: 20;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: flex-end;
      padding: clamp(14px, 3vw, 26px) clamp(18px, 4vw, 56px) 0 0;
      pointer-events: none;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    .soft-button, .icon-button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.58);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: .25s ease;
    }
    .soft-button { min-height: 40px; padding: 0 16px; border-radius: 999px; }
    .icon-button { width: 40px; height: 40px; border-radius: 50%; }
    .soft-button:hover, .icon-button:hover { background: white; transform: translateY(-2px); }

    .viewport { position: fixed; inset: 0; z-index: 2; }
    .track { height: 100%; transition: transform .85s cubic-bezier(.76, 0, .24, 1); }
    .screen {
      position: relative;
      height: 100vh;
      padding: 112px clamp(22px, 7vw, 110px) 74px;
      display: grid;
      align-items: center;
      overflow: hidden;
    }
    .screen.hidden-screen { display: none; }
    /* 切屏过渡（顺序式）：旧屏先快速失焦淡出 → 新屏延迟聚焦清晰化 */
    .screen.entering { animation: screen-in .95s cubic-bezier(.16, .84, .3, 1) .5s both; }
    .screen.leaving { animation: screen-out .6s cubic-bezier(.45, 0, .9, .55) both; }
    @keyframes screen-in {
      from { opacity: .2; filter: blur(20px); transform: scale(1.04); }
      to { opacity: 1; filter: blur(0); transform: scale(1); }
    }
    @keyframes screen-out {
      from { opacity: 1; filter: blur(0); transform: scale(1); }
      to { opacity: 0; filter: blur(16px); transform: scale(1.03); }
    }
    .content { position: relative; z-index: 2; width: min(1180px, 100%); margin: 0 auto; }
    /* 切屏后：新一屏内容逐块交错浮现（stagger reveal） */
    .screen .content > * {
      opacity: 0; transform: translateY(26px);
      transition: opacity .75s ease, transform .75s cubic-bezier(.2, .7, .2, 1);
      will-change: opacity, transform;
    }
    .screen.active .content > * { opacity: 1; transform: none; }
    /* ========== 四屏背景板：插画底图 + 缓慢运镜 + 专属动态层 ========== */
    .bg-panel {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      transform-origin: center;
      animation: ken-home 30s ease-in-out infinite alternate;
    }
    .bg-panel::after {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(130% 100% at 50% 42%, transparent 55%, rgba(8, 20, 16, .38) 100%),
        linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 30%, rgba(10, 24, 20, .08) 66%, rgba(8, 20, 16, .42));
    }
    .bg-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    #screenInterest .bg-panel { animation: ken-interest 34s ease-in-out infinite alternate; }
    #screenMajor .bg-panel { animation: ken-major 40s ease-in-out infinite alternate; }
    #screenExperience .bg-panel { animation: ken-experience 32s ease-in-out infinite alternate; }
    @keyframes ken-home { from { transform: scale(1) translateX(0); } to { transform: scale(1.09) translateX(-1.2%); } }
    @keyframes ken-interest { from { transform: scale(1.03) translateX(-1%); } to { transform: scale(1.12) translateX(1.2%); } }
    @keyframes ken-major { from { transform: scale(1.06); } to { transform: scale(1.14) translateY(-1%); } }
    @keyframes ken-experience { from { transform: scale(1) translateY(0); } to { transform: scale(1.1) translateY(-1.2%); } }
    /* 首页：星点闪烁 */
    .bg-stars::before, .bg-stars::after {
      content: ''; position: absolute; width: 3px; height: 3px; border-radius: 50%;
      background: #fff;
      animation: twinkle 3.4s ease-in-out infinite;
    }
    .bg-stars::before {
      top: 14%; left: 8%;
      box-shadow:
        14vw 6vh 0 0 rgba(255,255,255,.9), 30vw 2vh 0 1px rgba(255,255,255,.7),
        44vw 9vh 0 0 rgba(255,255,255,.85), 61vw 4vh 0 1px rgba(255,255,255,.65),
        78vw 8vh 0 0 rgba(255,255,255,.9), 90vw 3vh 0 1px rgba(255,255,255,.7),
        22vw 13vh 0 1px rgba(255,255,255,.55), 55vw 12vh 0 0 rgba(255,255,255,.75);
    }
    .bg-stars::after {
      top: 22%; left: 16%;
      box-shadow:
        10vw 9vh 0 1px rgba(255,255,255,.6), 36vw 14vh 0 0 rgba(255,255,255,.8),
        68vw 15vh 0 1px rgba(255,255,255,.6), 84vw 11vh 0 0 rgba(255,255,255,.7);
      animation-delay: -1.7s;
    }
    @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }
    /* 兴趣页：云朵飘移 */
    .bg-clouds::before, .bg-clouds::after {
      content: ''; position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.5);
      filter: blur(2px);
    }
    .bg-clouds::before { width: 240px; height: 64px; top: 20%; animation: drift 52s linear infinite; }
    .bg-clouds::after { width: 150px; height: 40px; top: 32%; animation: drift 38s linear infinite; animation-delay: -22s; }
    @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(115vw); } }
    /* 经历页：光点上升 */
    .bg-rise::before, .bg-rise::after {
      content: ''; position: absolute; width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255, 226, 170, .95);
      bottom: -10%;
      animation: rise 13s linear infinite;
    }
    .bg-rise::before {
      left: 12%;
      box-shadow:
        16vw -18vh 0 1px rgba(255,226,170,.7), 33vw -34vh 0 0 rgba(255,226,170,.8),
        52vw -22vh 0 1px rgba(255,226,170,.65), 71vw -40vh 0 0 rgba(255,226,170,.75),
        88vw -16vh 0 1px rgba(255,226,170,.6);
    }
    .bg-rise::after {
      left: 30%;
      box-shadow:
        22vw -26vh 0 0 rgba(255,226,170,.75), 44vw -40vh 0 1px rgba(255,226,170,.6),
        63vw -14vh 0 0 rgba(255,226,170,.8), 80vw -30vh 0 1px rgba(255,226,170,.65);
      animation-delay: -6.5s;
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-108vh); opacity: 0; }
    }
    /* 专业页（深色脑机插画）：文字提亮保证可读 */
    #screenMajor .section-content { color: #eaf6ff; }
    #screenMajor .section-head h2 { color: #dff3ff; text-shadow: 0 2px 18px rgba(70, 170, 255, .45); }
    #screenMajor .section-body { color: #eaf6ff; }
    /* 鼠标波纹 + 拖尾画布（覆盖内容之上、顶栏之下，不拦截交互） */
    #fxCanvas {
      position: fixed; inset: 0; z-index: 18;
      pointer-events: none;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-family: Georgia, "Times New Roman", "Noto Serif SC", serif; font-weight: 500; }
    h1 { max-width: 850px; margin-bottom: 26px; font-size: clamp(52px, 7.8vw, 112px); line-height: .94; letter-spacing: -.055em; }
    .home-grid { display: grid; grid-template-columns: 1fr; align-content: start; gap: clamp(24px, 4vh, 44px); min-height: 100%; }
    .home-head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .home-name {
      max-width: 94%; margin-bottom: 0;
      font-size: clamp(64px, 9.6vw, 150px); line-height: .92; letter-spacing: -.05em;
      color: var(--ink);
      text-shadow: 0 2px 0 rgba(255,255,255,.65), 0 12px 40px rgba(255,255,255,.55);
    }
    .home-bio-wrap {
      position: fixed; z-index: 12;
      left: max(12px, min(calc(61% - 430px - 4cm), calc(100vw - min(92vw, 860px) - 12px)));
      top: 63%;
      transform: translate(-50%, -50%);
      width: min(92vw, 860px); max-width: 860px;
    }
    .contact-link {
      justify-self: start;
      margin-top: 2px; padding: 0 2px 2px;
      background: none; border: 0;
      font-size: 21px; font-weight: 750; letter-spacing: .22em;
      color: var(--accent); cursor: pointer;
      border-bottom: 2px solid rgba(47,112,96,.35);
      transition: color .2s, border-color .2s, letter-spacing .25s;
    }
    .contact-link:hover { color: var(--ink); border-color: var(--ink); letter-spacing: .3em; }
    .bookmarks {
      position: fixed; z-index: 15;
      left: clamp(12px, 2.6vw, 44px);
      top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 12px;
    }
    .bookmark {
      position: relative;
      padding: 11px 20px 11px 18px;
      font-size: 15px; font-weight: 650; letter-spacing: .08em;
      color: var(--accent); text-align: left; cursor: pointer;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(47,112,96,.28);
      border-left: 4px solid var(--accent);
      border-radius: 0 14px 14px 0;
      box-shadow: 2px 5px 16px rgba(24,49,45,.14);
      transition: transform .25s, box-shadow .25s, background .25s, color .25s;
    }
    .bookmark::after {
      content: ''; position: absolute; right: 0; top: 0;
      width: 14px; height: 14px;
      background: linear-gradient(135deg, transparent 50%, rgba(47,112,96,.16) 50%);
      border-radius: 0 14px 0 0;
    }
    .bookmark:hover { transform: translateX(7px); box-shadow: 4px 9px 22px rgba(24,49,45,.22); }
    .bookmark.active {
      background: var(--accent); color: #fff; transform: translateX(7px);
      box-shadow: 4px 9px 22px rgba(47,112,96,.4);
    }
    .bookmark.active::after { background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.18) 50%); }
    .section-content { width: min(920px, 100%); margin: 0 auto; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .section-head h2 { margin: 0; font-size: clamp(28px, 4.5vw, 52px); line-height: 1.1; }
    .section-body {
      padding: 30px 40px; border-radius: 26px;
      background: rgba(255,255,255,.6); backdrop-filter: blur(14px); box-shadow: var(--shadow);
      font-size: clamp(18px, 1.9vw, 24px); line-height: 1.85; color: var(--ink); white-space: pre-line;
    }
    .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
    .tab {
      padding: 10px 22px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,.62); color: var(--ink); cursor: pointer;
      font-size: 15px; font-weight: 650; transition: background .3s, color .3s, transform .3s, box-shadow .3s;
    }
    .tab:hover { transform: translateY(-2px); }
    .tab.active { background: var(--accent); color: #fff; box-shadow: 0 8px 22px rgba(47,112,96,.35); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .tab-pane p {
      margin: 0; padding: 26px 34px; border-radius: 22px;
      background: rgba(255,255,255,.6); backdrop-filter: blur(14px); box-shadow: var(--shadow);
      font-size: clamp(18px, 1.9vw, 24px); line-height: 1.85; color: var(--ink); white-space: pre-line;
    }
    .exp-list { display: grid; gap: 16px; max-height: 62vh; overflow: auto; padding: 4px 2px; }
    .exp-card {
      display: grid; gap: 10px; padding: 18px 22px; border-radius: 22px;
      background: rgba(255,255,255,.62); backdrop-filter: blur(14px); box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.5);
    }
    .exp-card img { width: 100%; max-height: 240px; object-fit: cover; border-radius: 14px; }
    .exp-card h3 { margin: 0; font-size: 21px; }
    .exp-card p { margin: 0; font-size: 16px; line-height: 1.8; color: var(--ink); white-space: pre-line; }
    .exp-empty { margin: 0; color: var(--muted); }
    .exp-edit-row {
      display: grid; gap: 9px; padding: 14px; margin-bottom: 10px;
      border: 1px dashed var(--line); border-radius: 16px; background: rgba(241,248,246,.55);
    }
    .exp-edit-row .exp-title, .exp-edit-row .exp-text {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
      color: var(--ink); background: white; font-size: 14px;
    }
    .exp-edit-row .exp-text { min-height: 70px; resize: vertical; }
    .exp-img-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .exp-thumb { width: 84px; height: 58px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
    .soft-button.small { padding: 8px 14px; font-size: 13px; min-height: 0; }
    .soft-button.danger { color: #b3261e; border-color: rgba(179,38,30,.35); background: rgba(179,38,30,.06); }
    .exp-hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
    .home-welcome { margin: 0 0 4px; font-size: clamp(16px, 1.8vw, 22px); letter-spacing: .3em; color: var(--accent); }
    .home-quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(94vw, 900px); margin-top: clamp(20px, 3.5vh, 34px); }
    .qcard { padding: 14px 18px; border-radius: 18px; background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.6); box-shadow: 2px 8px 24px rgba(24,49,45,.12); }
    .q-tag { font-size: 12px; font-weight: 800; letter-spacing: .24em; color: var(--accent); }
    .q-text { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink); }
    .tab-pane { display: none; position: relative; }
    .tab-pane.active { display: block; }
    .tab-pane .pane-text {
      position: relative; z-index: 1;
      max-width: 54%; text-align: center;
      margin: 170px auto; padding: 40px 30px; border-radius: 22px;
      background: rgba(255,255,255,.6); backdrop-filter: blur(14px); box-shadow: var(--shadow);
      font-size: clamp(18px, 1.9vw, 24px); line-height: 1.85; color: var(--ink); white-space: pre-line;
    }
    #paneTravel { min-height: 340px; }
    .angle-img { position: absolute; width: 156px; height: 156px; object-fit: cover; border-radius: 14px; border: 2px solid rgba(255,255,255,.9); box-shadow: 0 10px 24px rgba(24,49,45,.2); z-index: 2; }
    .angle-img.tl { top: 0; left: 0; } .angle-img.tr { top: 0; right: 0; } .angle-img.bl { bottom: 0; left: 0; } .angle-img.br { bottom: 0; right: 0; }
    .exp-cat-line { display: flex; }
    .exp-edit-row .exp-cat { width: 150px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; background: white; color: var(--ink); }
    .exp-cat-badge { justify-self: start; padding: 3px 12px; border-radius: 999px; background: rgba(47,112,96,.12); color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .14em; }
    .timg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
    .timg { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 12px; background: rgba(241,248,246,.5); }
    .timg span { font-size: 12px; color: var(--muted); min-width: 44px; }
    .tthumb { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .exp-toolbar { display: flex; justify-content: flex-end; margin-bottom: 14px; }    .home-bio {
      margin-bottom: 0; padding: 28px 38px; border-radius: 26px;
      background: rgba(255,255,255,.58); backdrop-filter: blur(14px); box-shadow: var(--shadow);
      font-size: clamp(24px, 2.6vw, 36px); line-height: 1.75; color: var(--ink); white-space: pre-line;
    }
    .home-name.is-empty { visibility: hidden; }
    .home-bio.is-empty { display: none; }
    .empty-banner {
      display: inline-flex; align-items: center; gap: 9px; margin-bottom: 22px;
      padding: 10px 16px; border: 1px dashed var(--accent); border-radius: 999px;
      background: rgba(255,255,255,.55); color: var(--accent); font-size: 14px; font-weight: 650;
    }
    .empty-banner.hidden { display: none; }
    .primary-button {
      min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0;
      background: var(--ink); color: white; cursor: pointer; box-shadow: 0 12px 30px rgba(24,49,45,.18);
    }
    .text-button { min-height: 48px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; color: var(--accent); }
    .glass {
      border: 1px solid rgba(255,255,255,.62);
      background: var(--glass);
      backdrop-filter: blur(24px);
      box-shadow: var(--shadow);
    }




    .feedback-trigger {
      position: fixed; z-index: 24; right: clamp(18px, 3vw, 44px); bottom: 28px;
      min-height: 46px; padding: 0 19px; border: 1px solid rgba(255,255,255,.7); border-radius: 999px;
      color: white; background: var(--ink); box-shadow: 0 14px 34px rgba(24,49,45,.22); cursor: pointer;
    }
    .feedback-card { width: min(560px, 100%); }
    .feedback-intro { margin: -8px 0 20px; color: var(--muted); line-height: 1.65; }
    .identity-choice { display: flex; gap: 10px; margin-bottom: 16px; }
    .identity-choice label {
      flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px;
      background: white; cursor: pointer;
    }
    .identity-choice input { accent-color: var(--accent); }
    .feedback-status { min-height: 20px; margin: 14px 0 0; font-size: 13px; color: var(--muted); }
    .feedback-status.success { color: #237052; }
    .feedback-status.error { color: #a13d35; }
    .honeypot { position: absolute !important; left: -9999px !important; opacity: 0 !important; }

    .screen-label { position: fixed; z-index: 20; left: clamp(20px, 5vw, 72px); bottom: 28px; font-size: 12px; letter-spacing: .16em; color: var(--muted); }
    .progress { position: fixed; z-index: 22; left: 0; bottom: 0; width: 100%; height: 3px; background: rgba(255,255,255,.3); }
    .progress span { display: block; width: 20%; height: 100%; background: var(--accent); transition: width .8s ease; }

    .modal { position: fixed; z-index: 50; inset: 0; display: none; place-items: center; padding: 20px; background: rgba(18,39,34,.36); backdrop-filter: blur(12px); }
    .modal.open { display: grid; }
    .modal-card { width: min(720px, 100%); max-height: 90vh; overflow: auto; padding: 28px; border-radius: 28px; background: #f6faf8; box-shadow: 0 30px 90px rgba(13,34,29,.25); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .modal-head h3 { margin: 0; font: 30px Georgia, serif; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 13px; color: var(--muted); }
    .field input, .field textarea, .field select { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: white; outline: none; font-size: 14px; }
    .field textarea { min-height: 100px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,112,96,.1); }
    .size-row { display: flex; align-items: center; gap: 12px; }
    .size-row input[type="range"] { flex: 1; padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
    .size-row input[type="range"]:focus { box-shadow: none; border: 0; }
    .size-val { min-width: 46px; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .hint { font-size: 12px; color: var(--muted); }

    @media (max-width: 820px) {
      .site-header { padding-top: clamp(10px, 2.6vw, 16px); padding-right: clamp(12px, 3.6vw, 24px); }
      .screen { padding-top: 90px; padding-bottom: 58px; }
      .home-grid { grid-template-columns: 1fr; gap: 24px; }
      .home-bio-wrap { left: 50%; top: 58%; width: 92vw; }
      .bookmarks { left: 50%; top: auto; bottom: 16px; transform: translateX(-50%); flex-direction: row; gap: 8px; }
      .bookmark { padding: 8px 16px; border-left: 0; border-bottom: 4px solid var(--accent); border-radius: 12px 12px 0 0; }
      .bookmark::after { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      h1 { font-size: clamp(48px, 16vw, 72px); max-width: 88%; }
      .home-quick { grid-template-columns: 1fr; }
      .angle-img { width: 108px; height: 108px; }
      .tab-pane .pane-text { max-width: 44%; margin: 122px auto; padding: 30px 16px; }
    }
    @media (max-height: 720px) {
      .screen { padding-top: 88px; padding-bottom: 46px; }
      h1 { font-size: clamp(48px, 7vw, 80px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="landscape" aria-hidden="true">
    <div class="px px-sun"><div class="sun"></div></div>
    <div class="px px-mist1"><div class="mist one"></div></div>
    <div class="px px-mist2"><div class="mist two"></div></div>
    <div class="px px-far"><div class="ridge far"></div></div>
    <div class="px px-mid"><div class="ridge mid"></div></div>
    <div class="px px-near"><div class="ridge near"></div></div>
    <div class="grain"></div>
  </div>

  <header class="site-header">
    <div class="header-actions">
      <button class="soft-button" id="languageButton" type="button">EN</button>
      <button class="icon-button" id="editButton" type="button" aria-label="编辑资料">✎</button>
    </div>
  </header>

  <main class="viewport">
    <div class="track" id="track">
      <section class="screen" id="homeScreen" aria-label="首页">
        <div class="bg-panel" style="background-image:url(images/bg-home.jpg)"></div>
        <div class="bg-layer bg-stars"></div>
        <div class="content home-grid">
          <div class="home-head"><h1 class="home-name" data-bind="name"></h1><button class="contact-link" id="contactLink" type="button" data-i18n="contact">联系</button></div>
          <p class="home-welcome" data-i18n="homeWelcome">欢迎来到我的个人主页</p>
          <div class="home-quick">
            <div class="qcard"><span class="q-tag" data-i18n="travelLabel">旅行</span><p class="q-text" id="qTravel">&mdash;</p></div>
            <div class="qcard"><span class="q-tag" data-i18n="sportLabel">运动</span><p class="q-text" id="qSport">&mdash;</p></div>
            <div class="qcard"><span class="q-tag" data-i18n="majorLabel">专业</span><p class="q-text" id="qMajor">&mdash;</p></div>
          </div>
          <div class="home-bio-wrap">
            <div class="empty-banner" id="emptyBanner" data-i18n="emptyHint">资料为空，点击右上角 ✎ 开始填写。</div>
            <p class="home-bio" data-bind="bio"></p>
          </div>
        </div>
      </section>
      <section class="screen" id="screenInterest" aria-label="兴趣">
        <div class="bg-panel" style="background-image:url(images/bg-interest.jpg)"></div>
        <div class="bg-layer bg-clouds"></div>
        <div class="content section-content">
          <div class="section-head"><h2 data-i18n="chipInterest">兴趣</h2><button class="contact-link" type="button" data-i18n="contact">联系</button></div>
          <div class="tabs" role="tablist">
            <button class="tab active" type="button" data-tab="travel" data-i18n="tabTravel">旅行</button>
            <button class="tab" type="button" data-tab="sport" data-i18n="tabSport">运动</button>
          </div>
          <div class="tab-pane active" id="paneTravel"></div>
          <div class="tab-pane" id="paneSport"></div>
        </div>
      </section>
      <section class="screen" id="screenMajor" aria-label="专业">
        <div class="bg-panel" style="background-image:url(images/bg-major.jpg)"></div>
        <canvas class="bg-layer neuro-canvas" id="neuroCanvas"></canvas>
        <div class="content section-content">
          <div class="section-head"><h2 data-i18n="chipMajor">专业</h2><button class="contact-link" type="button" data-i18n="contact">联系</button></div>
          <div class="section-body" id="bodyMajor"></div>
        </div>
      </section>
      <section class="screen" id="screenExperience" aria-label="经历">
        <div class="bg-panel" style="background-image:url(images/bg-experience.jpg)"></div>
        <div class="bg-layer bg-rise"></div>
        <div class="content section-content">
          <div class="section-head"><h2 data-i18n="chipExperience">经历</h2><button class="contact-link" type="button" data-i18n="contact">联系</button></div>
          <div class="exp-toolbar"><button class="soft-button small" id="expAddBtn" type="button" data-i18n="addExpItem">＋ 添加栏目</button></div>
          <div class="exp-list" id="expList"></div>
        </div>
      </section>
    </div>
  </main>
  <nav class="bookmarks" aria-label="栏目书签">
    <button class="bookmark active" type="button" data-target="0" data-i18n="bookmarkHome">首页</button>
    <button class="bookmark" type="button" data-target="1" data-i18n="chipInterest">兴趣</button>
    <button class="bookmark" type="button" data-target="2" data-i18n="chipMajor">专业</button>
    <button class="bookmark" type="button" data-target="3" data-i18n="chipExperience">经历</button>
  </nav>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>

  <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal-card" id="profileForm">
      <div class="modal-head"><h3 id="modalTitle" data-i18n="editProfile">编辑个人资料</h3><button class="icon-button" id="closeModal" type="button" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <div class="field full"><label for="nameInput" data-i18n="nameLabel">姓名</label><input id="nameInput" name="name" placeholder="例如：张三" required></div>
        <div class="field full"><label for="bioInput" data-i18n="bioLabel">个人简介</label><textarea id="bioInput" name="bio" placeholder="写一段关于你的介绍……"></textarea></div>
        <div class="field"><label for="fontNameInput" data-i18n="fontNameLabel">姓名字体</label><select id="fontNameInput" name="fontName"></select></div>
        <div class="field"><label for="fontNameSizeInput" data-i18n="fontNameSizeLabel">姓名大小</label><div class="size-row"><input type="range" id="fontNameSizeInput" min="40" max="170" step="2"><span class="size-val" id="fontNameSizeVal">96px</span></div></div>
        <div class="field"><label for="fontBioInput" data-i18n="fontBioLabel">简介字体</label><select id="fontBioInput" name="fontBio"></select></div>
        <div class="field"><label for="fontBioSizeInput" data-i18n="fontBioSizeLabel">简介大小</label><div class="size-row"><input type="range" id="fontBioSizeInput" min="18" max="64" step="1"><span class="size-val" id="fontBioSizeVal">28px</span></div></div>
        <div class="field full"><label for="travelInput" data-i18n="travelLabel">旅行</label><textarea id="travelInput" name="travel" placeholder="例如：环岛骑行、登山露营……"></textarea></div>
        <div class="field full"><label data-i18n="travelImgsLabel">旅行四角图片</label><div class="timg-grid" id="travelImgsEdit">
          <div class="timg"><span data-i18n="travelImgTl">左上角</span><button class="soft-button small tpick" type="button" data-pos="tl" data-i18n="travelImgPick">选择图片</button><input type="file" accept="image/*" class="tfile" data-pos="tl" hidden><img class="tthumb" data-pos="tl" alt=""></div>
          <div class="timg"><span data-i18n="travelImgTr">右上角</span><button class="soft-button small tpick" type="button" data-pos="tr" data-i18n="travelImgPick">选择图片</button><input type="file" accept="image/*" class="tfile" data-pos="tr" hidden><img class="tthumb" data-pos="tr" alt=""></div>
          <div class="timg"><span data-i18n="travelImgBl">左下角</span><button class="soft-button small tpick" type="button" data-pos="bl" data-i18n="travelImgPick">选择图片</button><input type="file" accept="image/*" class="tfile" data-pos="bl" hidden><img class="tthumb" data-pos="bl" alt=""></div>
          <div class="timg"><span data-i18n="travelImgBr">右下角</span><button class="soft-button small tpick" type="button" data-pos="br" data-i18n="travelImgPick">选择图片</button><input type="file" accept="image/*" class="tfile" data-pos="br" hidden><img class="tthumb" data-pos="br" alt=""></div>
        </div></div>
        <div class="field full"><label for="sportInput" data-i18n="sportLabel">运动</label><textarea id="sportInput" name="sport" placeholder="例如：跑步、篮球、羽毛球……"></textarea></div>
        <div class="field full"><label for="majorInput" data-i18n="majorLabel">专业</label><textarea id="majorInput" name="major" placeholder="例如：计算机科学与技术"></textarea></div>
        <div class="field full"><label data-i18n="expLabel">经历栏目</label><div id="expItemsEdit"></div><button class="soft-button small" id="addExpItem" type="button" data-i18n="addExpItem">＋ 添加栏目</button><p class="exp-hint" data-i18n="expImgHint">图片会自动压缩保存（无需联网）</p></div>
      </div>
      <div class="modal-actions"><button class="soft-button" id="resetProfile" type="button" data-i18n="reset">清空资料</button><button class="primary-button" type="submit" data-i18n="save">保存资料</button></div>
    </form>
  </div>

  <div class="modal" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
    <form class="modal-card" id="contactForm">
      <div class="modal-head"><h3 id="contactTitle" data-i18n="contactTitle">联系我</h3><button class="icon-button" id="closeContact" type="button" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <div class="field full"><label for="phoneInput" data-i18n="phoneLabel">手机号</label><input id="phoneInput" name="phone" type="tel" placeholder="例如：138 0000 0000"></div>
        <div class="field full"><label for="emailInput" data-i18n="emailLabel">邮箱地址</label><input id="emailInput" name="email" type="email" placeholder="例如：name@example.com"></div>
      </div>
      <div class="modal-actions"><button class="primary-button" type="submit" data-i18n="save">保存资料</button></div>
    </form>
  </div>

  <script>
    (() => {
      const PROFILE_KEY = 'personal-homepage-enhanced-v2';
      const LANGUAGE_KEY = 'personal-homepage-language';
      const FONTS = [
        { label: '衬线体（默认）', value: 'Georgia, "Noto Serif SC", serif' },
        { label: '楷体', value: 'KaiTi, "楷体", serif' },
        { label: '黑体', value: 'SimHei, "黑体", sans-serif' },
        { label: '宋体', value: 'SimSun, "宋体", serif' },
        { label: '仿宋', value: 'FangSong, "仿宋", serif' },
        { label: '隶书', value: 'LiSu, "隶书", serif' },
        { label: '微软雅黑', value: '"Microsoft YaHei", "PingFang SC", sans-serif' },
        { label: '等宽字体', value: '"Courier New", monospace' },
        { label: 'Impact 粗衬线', value: 'Impact, "Arial Black", sans-serif' }
      ];
      const defaults = {
        name: '', bio: '',
        fontName: 'Georgia, "Noto Serif SC", serif',
        fontBio: 'Georgia, "Noto Serif SC", serif',
        fontNameSize: 96,
        fontBioSize: 28,
        travel: '', sport: '', major: '',
        travelImgs: { tl: '', tr: '', bl: '', br: '' },
        expItems: [],
        phone: '', email: ''
      };
      const copy = {
        zh: {
          editProfile: '编辑个人资料', nameLabel: '姓名', bioLabel: '个人简介', fontNameLabel: '姓名字体', fontBioLabel: '简介字体', fontNameSizeLabel: '姓名大小', fontBioSizeLabel: '简介大小',
          travelLabel: '旅行', sportLabel: '运动', majorLabel: '专业',
          tabTravel: '旅行', tabSport: '运动',
          travelImgsLabel: '旅行四角图片', travelImgPick: '选择图片',
          travelImgTl: '左上角', travelImgTr: '右上角', travelImgBl: '左下角', travelImgBr: '右下角',
          expCatDefault: '通用',
          expLabel: '经历栏目', addExpItem: '＋ 添加栏目', expTitlePh: '栏目标题（可选）', expTextPh: '栏目内容',
          expPickImg: '选择图片', expRemoveImg: '移除图片', expDelItem: '删除栏目', expImgHint: '图片会自动压缩保存（无需联网）',
          chipInterest: '兴趣', chipMajor: '专业', chipExperience: '经历',
          reset: '清空资料', save: '保存资料', emptyHint: '资料为空，点击右上角 ✎ 开始填写。', emptySection: '（暂无内容，点击右上角 ✎ 填写）',
          contact: '联系', contactTitle: '联系我', phoneLabel: '手机号', emailLabel: '邮箱地址', bookmarkHome: '首页'
        },
        en: {
          editProfile: 'Edit profile', nameLabel: 'Name', bioLabel: 'Short bio', fontNameLabel: 'Name font', fontBioLabel: 'Bio font', fontNameSizeLabel: 'Name size', fontBioSizeLabel: 'Bio size',
          travelLabel: 'Travel', sportLabel: 'Sports', majorLabel: 'Major',
          tabTravel: 'Travel', tabSport: 'Sports',
          travelImgsLabel: 'Travel corner photos', travelImgPick: 'Pick image',
          travelImgTl: 'Top-left', travelImgTr: 'Top-right', travelImgBl: 'Bottom-left', travelImgBr: 'Bottom-right',
          expCatDefault: 'General',
          expLabel: 'Experience entries', addExpItem: '+ Add entry', expTitlePh: 'Entry title (optional)', expTextPh: 'Entry content',
          expPickImg: 'Choose image', expRemoveImg: 'Remove image', expDelItem: 'Delete entry', expImgHint: 'Images are compressed and stored locally',
          chipInterest: 'Interests', chipMajor: 'Major', chipExperience: 'Experience',
          reset: 'Clear all', save: 'Save profile', emptyHint: 'Your profile is empty. Click ✎ in the top-right to start filling it in.', emptySection: '(Nothing here yet — click ✎ to add.)',
          contact: 'Contact', contactTitle: 'Contact me', phoneLabel: 'Phone', emailLabel: 'Email', bookmarkHome: 'Home'
        }
      };
      let profile = loadProfile();
      let language = localStorage.getItem(LANGUAGE_KEY) === 'en' ? 'en' : 'zh';
      const screens = [...document.querySelectorAll('.screen')];
      const track = document.getElementById('track');
      const modal = document.getElementById('editModal');
      const contactModal = document.getElementById('contactModal');
      const contactForm = document.getElementById('contactForm');
      const form = document.getElementById('profileForm');
      const bookmarkButtons = [...document.querySelectorAll('.bookmark')];
      let current = 0;
      let wheelLock = false;
      let screenCleanTimer = null;

      function loadProfile() {
        try {
          const saved = JSON.parse(localStorage.getItem(PROFILE_KEY)) || {};
          if (!saved.travel && !saved.sport && saved.interest) saved.travel = saved.interest;
          if (!Array.isArray(saved.expItems) && saved.experience) saved.expItems = [{ title: '', text: saved.experience, img: '' }];
          if (Array.isArray(saved.expItems)) saved.expItems = saved.expItems.map(it => ({ cat: '', ...it }));
          return { ...defaults, ...saved };
        }
        catch { return { ...defaults }; }
      }
      function renderProfile() {
        document.querySelectorAll('[data-bind]').forEach(el => {
          const key = el.dataset.bind;
          if (profile[key] !== undefined) {
            const value = (profile[key] || '').trim();
            el.textContent = value;
            el.classList.toggle('is-empty', !value);
          }
        });
        const hasAny = [profile.name, profile.bio].some(v => (v || '').trim());
        const emptyBanner = document.getElementById('emptyBanner');
        if (emptyBanner) emptyBanner.classList.toggle('hidden', hasAny);
        const nameEl = document.querySelector('.home-name');
        const bioEl = document.querySelector('.home-bio');
        if (nameEl) { nameEl.style.fontFamily = profile.fontName; nameEl.style.fontSize = `${profile.fontNameSize}px`; }
        if (bioEl) { bioEl.style.fontFamily = profile.fontBio; bioEl.style.fontSize = `${profile.fontBioSize}px`; }
        document.title = profile.name ? `${profile.name} · Personal Homepage` : 'Personal Homepage';
        renderQuick();
      }
      function renderQuick() {
        [['qTravel', profile.travel], ['qSport', profile.sport], ['qMajor', profile.major]].forEach(([id, v]) => {
          const el = document.getElementById(id);
          if (!el) return;
          const txt = (v || '').trim();
          el.textContent = txt ? (txt.length > 46 ? txt.slice(0, 46) + '…' : txt) : '—';
        });
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      }
      function renderLanguage() {
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.dataset.i18n;
          if (copy[language][key]) el.textContent = copy[language][key];
        });
        document.getElementById('languageButton').textContent = language === 'zh' ? 'EN' : '中';
      }

      function setPaneText(paneId, text) {
        const pane = document.getElementById(paneId);
        if (!pane) return;
        pane.innerHTML = '';
        const p = document.createElement('p');
        p.textContent = text || copy[language].emptySection;
        pane.appendChild(p);
      }
      function renderTravel() {
        const pane = document.getElementById('paneTravel');
        if (!pane) return;
        pane.innerHTML = '';
        const imgs = profile.travelImgs || {};
        [['tl', 'angle-img tl'], ['tr', 'angle-img tr'], ['bl', 'angle-img bl'], ['br', 'angle-img br']].forEach(([k, cls]) => {
          if (imgs[k]) {
            const im = document.createElement('img');
            im.className = cls; im.src = imgs[k]; im.alt = '';
            pane.appendChild(im);
          }
        });
        const p = document.createElement('p');
        p.className = 'pane-text';
        p.textContent = profile.travel || copy[language].emptySection;
        pane.appendChild(p);
      }
      function fillScreens() {
        renderTravel();
        setPaneText('paneSport', profile.sport);
        const bodyMajor = document.getElementById('bodyMajor');
        if (bodyMajor) bodyMajor.textContent = profile.major || copy[language].emptySection;
        renderExperience();
      }
      function renderExperience() {
        const wrap = document.getElementById('expList');
        if (!wrap) return;
        wrap.innerHTML = '';
        const items = (profile.expItems || []).filter(it => it.title || it.text || it.img);
        if (!items.length) {
          const p = document.createElement('p');
          p.className = 'exp-empty';
          p.textContent = copy[language].emptySection;
          wrap.appendChild(p);
          return;
        }
        items.forEach(it => {
          const card = document.createElement('article');
          card.className = 'exp-card';
          if (it.cat) {
            const b = document.createElement('span');
            b.className = 'exp-cat-badge'; b.textContent = it.cat;
            card.appendChild(b);
          }
          if (it.img) {
            const im = document.createElement('img');
            im.src = it.img; im.alt = it.title || '';
            card.appendChild(im);
          }
          if (it.title) {
            const h = document.createElement('h3');
            h.textContent = it.title; card.appendChild(h);
          }
          if (it.text) {
            const q = document.createElement('p');
            q.textContent = it.text; card.appendChild(q);
          }
          wrap.appendChild(card);
        });
      }
      function compressImage(file, maxSide, cb) {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * scale));
          c.height = Math.max(1, Math.round(img.height * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', .82));
        };
        img.onerror = () => { URL.revokeObjectURL(url); cb(''); };
        img.src = url;
      }
      function expRowHtml(it) {
        const L = copy[language];
        return `<div class="exp-edit-row">
          <input type="text" class="exp-title" placeholder="${L.expTitlePh}" value="${escapeHtml(it.title)}">
          <textarea class="exp-text" placeholder="${L.expTextPh}">${escapeHtml(it.text)}</textarea>
          <div class="exp-cat-line">
            <select class="exp-cat">
              <option value="">${L.expCatDefault}</option>
              <option value="工作"${it.cat === '工作' ? ' selected' : ''}>工作</option>
              <option value="教育"${it.cat === '教育' ? ' selected' : ''}>教育</option>
              <option value="项目"${it.cat === '项目' ? ' selected' : ''}>项目</option>
              <option value="生活"${it.cat === '生活' ? ' selected' : ''}>生活</option>
            </select>
          </div>
          <div class="exp-img-line">
            <button class="soft-button small exp-pick" type="button">${L.expPickImg}</button>
            <input type="file" accept="image/*" class="exp-file" hidden>
            <img class="exp-thumb" alt="" ${it.img ? `src="${it.img}"` : 'hidden'}>
            <button class="soft-button small danger exp-clear" type="button" ${it.img ? '' : 'hidden'}>${L.expRemoveImg}</button>
            <button class="soft-button small danger exp-del" type="button">${L.expDelItem}</button>
          </div>
        </div>`;
      }
      function renderExpItemsEdit() {
        const box = document.getElementById('expItemsEdit');
        if (!box) return;
        box.innerHTML = (profile.expItems || []).map(expRowHtml).join('');
      }

      function goTo(n) {
        n = Math.max(0, Math.min(screens.length - 1, n));
        if (n === current) return;
        const from = current;
        current = n;
        screens.forEach((s, i) => {
          s.classList.toggle('active', i === n);
          s.classList.remove('entering', 'leaving');
        });
        screens[from].classList.add('leaving');
        screens[n].classList.add('entering');
        bookmarkButtons.forEach((b, i) => b.classList.toggle('active', i === n));
        fillScreens();
        track.style.transform = `translateY(-${n * 100}vh)`;
        window.scrollTo(0, 0);
        clearTimeout(screenCleanTimer);
        screenCleanTimer = setTimeout(() => {
          screens.forEach(s => s.classList.remove('entering', 'leaving'));
        }, 1600);
      }
      function openEditor() {
        ['name','bio','fontName','fontBio','travel','sport','major'].forEach(key => {
          const input = document.getElementById(`${key}Input`); if (input) input.value = profile[key] || '';
        });
        ['fontNameSize','fontBioSize'].forEach(key => {
          const range = document.getElementById(`${key}Input`);
          const val = document.getElementById(`${key}Val`);
          if (range && val) { range.value = profile[key]; val.textContent = `${profile[key]}px`; }
        });
        const timgs = profile.travelImgs || {};
        ['tl', 'tr', 'bl', 'br'].forEach(k => {
          const th = document.querySelector(`.tthumb[data-pos="${k}"]`);
          if (!th) return;
          if (timgs[k]) th.src = timgs[k]; else th.removeAttribute('src');
        });
        modal.classList.add('open');
        renderExpItemsEdit();
        document.getElementById('nameInput').focus();
      }
      function closeEditor() { modal.classList.remove('open'); }
      function openContact() {
        ['phone','email'].forEach(k => { const input = document.getElementById(`${k}Input`); if (input) input.value = profile[k] || ''; });
        contactModal.classList.add('open');
        document.getElementById('phoneInput').focus();
      }
      function closeContact() { contactModal.classList.remove('open'); }
      function anyModalOpen() { return modal.classList.contains('open') || contactModal.classList.contains('open'); }
      window.addEventListener('keydown', event => {
        if (modal.classList.contains('open') && event.key === 'Escape') { closeEditor(); return; }
        if (contactModal.classList.contains('open') && event.key === 'Escape') { closeContact(); return; }
        if (anyModalOpen()) return;
        if (event.key === 'ArrowDown' || event.key === 'PageDown' || event.key === ' ') { event.preventDefault(); goTo(current + 1); }
        else if (event.key === 'ArrowUp' || event.key === 'PageUp') { event.preventDefault(); goTo(current - 1); }
        else if (event.key === 'Home') { event.preventDefault(); goTo(0); }
      });
      window.addEventListener('wheel', event => {
        if (anyModalOpen() || wheelLock || Math.abs(event.deltaY) < 8) return;
        wheelLock = true;
        setTimeout(() => { wheelLock = false; }, 900);
        goTo(current + (event.deltaY > 0 ? 1 : -1));
      }, { passive: true });
      let touchStartY = null;
      window.addEventListener('touchstart', event => { touchStartY = event.touches[0].clientY; }, { passive: true });
      window.addEventListener('touchend', event => {
        if (anyModalOpen() || touchStartY === null) return;
        const dy = event.changedTouches[0].clientY - touchStartY;
        touchStartY = null;
        if (Math.abs(dy) > 60) goTo(current + (dy < 0 ? 1 : -1));
      }, { passive: true });
      bookmarkButtons.forEach(btn => {
        btn.addEventListener('click', () => goTo(Number(btn.dataset.target)));
      });
      document.getElementById('languageButton').addEventListener('click', () => {
        language = language === 'zh' ? 'en' : 'zh'; localStorage.setItem(LANGUAGE_KEY, language); renderLanguage(); fillScreens();
      });
      document.querySelectorAll('.tabs').forEach(box => {
        box.querySelectorAll('.tab').forEach(btn => {
          btn.addEventListener('click', () => {
            box.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const id = 'pane' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1);
            box.parentElement.querySelectorAll('.tab-pane').forEach(pp => pp.classList.remove('active'));
            const pane = document.getElementById(id);
            if (pane) pane.classList.add('active');
          });
        });
      });
      document.getElementById('expAddBtn').addEventListener('click', openEditor);
      const timgBox = document.getElementById('travelImgsEdit');
      timgBox.addEventListener('click', event => {
        const btn = event.target.closest('.tpick');
        if (!btn) return;
        const pos = btn.dataset.pos;
        const file = timgBox.querySelector(`.tfile[data-pos="${pos}"]`);
        if (file) file.click();
      });
      timgBox.addEventListener('change', event => {
        if (!event.target.classList.contains('tfile')) return;
        const file = event.target.files && event.target.files[0];
        if (!file || file.type.indexOf('image/') !== 0) return;
        const pos = event.target.dataset.pos;
        const th = timgBox.querySelector(`.tthumb[data-pos="${pos}"]`);
        compressImage(file, 800, dataUrl => {
          if (!dataUrl) { alert(language === 'zh' ? '图片读取失败' : 'Failed to read image'); return; }
          th.src = dataUrl;
        });
      });
      const expEdit = document.getElementById('expItemsEdit');
      expEdit.addEventListener('click', event => {
        const row = event.target.closest('.exp-edit-row');
        if (!row) return;
        if (event.target.classList.contains('exp-pick')) row.querySelector('.exp-file').click();
        else if (event.target.classList.contains('exp-del')) row.remove();
        else if (event.target.classList.contains('exp-clear')) {
          row.querySelector('.exp-file').value = '';
          const th = row.querySelector('.exp-thumb');
          th.removeAttribute('src'); th.hidden = true;
          row.querySelector('.exp-clear').hidden = true;
        }
      });
      expEdit.addEventListener('change', event => {
        if (!event.target.classList.contains('exp-file')) return;
        const file = event.target.files && event.target.files[0];
        if (!file || file.type.indexOf('image/') !== 0) return;
        const row = event.target.closest('.exp-edit-row');
        const th = row.querySelector('.exp-thumb');
        compressImage(file, 1100, dataUrl => {
          if (!dataUrl) { alert(language === 'zh' ? '图片读取失败' : 'Failed to read image'); return; }
          th.src = dataUrl; th.hidden = false;
          row.querySelector('.exp-clear').hidden = false;
        });
      });
      document.getElementById('addExpItem').addEventListener('click', () => {
        const box = document.getElementById('expItemsEdit');
        const row = document.createElement('div');
        row.className = 'exp-edit-row';
        row.innerHTML = expRowHtml({ title: '', text: '', img: '' });
        box.appendChild(row);
      });      document.getElementById('editButton').addEventListener('click', openEditor);
      document.getElementById('closeModal').addEventListener('click', closeEditor);
      modal.addEventListener('click', event => { if (event.target === modal) closeEditor(); });
      document.querySelectorAll('.contact-link').forEach(btn => btn.addEventListener('click', openContact));
      document.getElementById('closeContact').addEventListener('click', closeContact);
      contactModal.addEventListener('click', event => { if (event.target === contactModal) closeContact(); });
      form.addEventListener('submit', event => {
        event.preventDefault();
        ['name','bio','fontName','fontBio','travel','sport','major'].forEach(key => profile[key] = document.getElementById(`${key}Input`).value.trim());
        profile.expItems = [...document.querySelectorAll('#expItemsEdit .exp-edit-row')].map(row => ({
          title: row.querySelector('.exp-title').value.trim(),
          text: row.querySelector('.exp-text').value.trim(),
          img: row.querySelector('.exp-thumb').getAttribute('src') || '',
          cat: (row.querySelector('.exp-cat') || { value: '' }).value || ''
        })).filter(it => it.title || it.text || it.img);
        profile.travelImgs = {};
        ['tl', 'tr', 'bl', 'br'].forEach(k => {
          const th = document.querySelector(`.tthumb[data-pos="${k}"]`);
          profile.travelImgs[k] = (th && th.getAttribute('src')) || '';
        });
        try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
        catch { alert(language === 'zh' ? '保存失败，请重试。' : 'Save failed. Please try again.'); return; }
        renderProfile(); fillScreens(); closeEditor();
      });
      contactForm.addEventListener('submit', event => {
        event.preventDefault();
        ['phone','email'].forEach(k => profile[k] = document.getElementById(`${k}Input`).value.trim());
        try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
        catch { alert(language === 'zh' ? '保存失败，请重试。' : 'Save failed. Please try again.'); return; }
        closeContact();
      });
      document.getElementById('resetProfile').addEventListener('click', () => {
        profile = { ...defaults }; localStorage.removeItem(PROFILE_KEY); renderProfile(); fillScreens(); renderExpItemsEdit(); closeEditor();
      });
      ['fontName', 'fontBio'].forEach(k => {
        const sel = document.getElementById(`${k}Input`);
        FONTS.forEach(f => {
          const o = document.createElement('option'); o.value = f.value; o.textContent = f.label; sel.appendChild(o);
        });
      });
      [['fontNameSize', '.home-name'], ['fontBioSize', '.home-bio']].forEach(([key, sel]) => {
        const range = document.getElementById(`${key}Input`);
        const val = document.getElementById(`${key}Val`);
        range.addEventListener('input', () => {
          profile[key] = Number(range.value);
          val.textContent = `${range.value}px`;
          const el = document.querySelector(sel);
          if (el) el.style.fontSize = `${range.value}px`;
        });
      });
      screens.forEach(screenEl => {
        [...screenEl.querySelector('.content').children].forEach((child, i) => {
          child.style.transitionDelay = `${(i * 0.09).toFixed(2)}s`;
        });
      });
      screens[0].classList.add('active');           // 首屏直接呈现
      renderProfile(); renderLanguage(); fillScreens();
    })();

    /* ========== 专业页：脑机接口神经脉冲画布（连线 + 滚动脑波 + 数据脉冲） ========== */
    (function () {
      const wrap = document.getElementById('screenMajor');
      const canvas = document.getElementById('neuroCanvas');
      if (!wrap || !canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, nodes = [], pulses = [], nextPulse = 0, t = 0;
      function resize() {
        W = canvas.width = Math.floor(wrap.clientWidth);
        H = canvas.height = Math.floor(wrap.clientHeight);
        const count = Math.max(16, Math.round(W * H / 40000));
        nodes = Array.from({ length: count }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5,
          r: Math.random() * 1.8 + 1, ph: Math.random() * Math.PI * 2
        }));
        pulses = []; nextPulse = 0;
      }
      function linkTarget() {
        if (nodes.length < 2) return null;
        const a = nodes[Math.floor(Math.random() * nodes.length)];
        let b = null, best = Infinity;
        for (const n of nodes) {
          if (n === a) continue;
          const d = (n.x - a.x) ** 2 + (n.y - a.y) ** 2;
          if (d < best) { best = d; b = n; }
        }
        return b ? [a, b] : null;
      }
      function frame() {
        t += 1 / 60;
        if (wrap.classList.contains('active')) {
          const radius = 150;
          ctx.clearRect(0, 0, W, H);
          ctx.lineWidth = 1;
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i], b = nodes[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              if (dx * dx + dy * dy < radius * radius) {
                ctx.strokeStyle = 'rgba(120, 200, 255, .14)';
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
              }
            }
          }
          ctx.lineWidth = 2;
          ctx.strokeStyle = 'rgba(120, 230, 255, .55)';
          ctx.shadowColor = 'rgba(80, 200, 255, .8)';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          for (let x = 0; x <= W; x += 6) {
            const y = H * .62
              + Math.sin(x / 70 + t * 2.2) * 22
              + Math.sin(x / 23 - t * 1.4) * 9
              + Math.sin(x / 130 + t * .8) * 30;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.shadowBlur = 0;
          nodes.forEach(n => {
            n.x += n.vx; n.y += n.vy;
            if (n.x < 0 || n.x > W) n.vx *= -1;
            if (n.y < 0 || n.y > H) n.vy *= -1;
            const glow = .45 + .3 * Math.sin(t * 2 + n.ph);
            ctx.fillStyle = 'rgba(140, 215, 255, ' + glow.toFixed(2) + ')';
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
          });
          if (t > nextPulse) {
            const l = linkTarget();
            if (l) pulses.push({ ax: l[0].x, ay: l[0].y, bx: l[1].x, by: l[1].y, p: 0 });
            nextPulse = t + .9;
          }
          pulses = pulses.filter(pu => pu.p < 1);
          pulses.forEach(pu => {
            pu.p += .028;
            const x = pu.ax + (pu.bx - pu.ax) * pu.p;
            const y = pu.ay + (pu.by - pu.ay) * pu.p;
            ctx.fillStyle = 'rgba(255, 255, 255, .95)';
            ctx.shadowColor = 'rgba(140, 230, 255, 1)';
            ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          });
        }
        requestAnimationFrame(frame);
      }
      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(frame);
    })();

    /* ========== 鼠标波纹 + 拖尾（复刻流体站点：移动注入 + 速度场消散 + 柔光尾迹） ========== */
    (() => {
      const canvas = document.getElementById('fxCanvas');
      const ctx = canvas.getContext('2d');
      const modal = document.getElementById('editModal');
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let ripples = [], particles = [];
      let running = true, rafId = null, lastTs = 0;
      let lastPoint = null, distAcc = 0, rippleAcc = 0;
      const MAX_R = 110, DURATION = 1600;      // 波纹半径 / 生命周期
      const TRAIL_STEP = 14, RIPPLE_DIST = 70; // 拖尾粒子间距 / 波纹间距（移动中按距离生成）
      const MAX_P = 220;

      function resize() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener('resize', resize); resize();

      function spawnRipple(x, y, s) { ripples.push({ x, y, born: performance.now(), s }); if (ripples.length > 48) ripples.shift(); }
      function spawnParticle(x, y, dx, dy) {
        const sp = Math.min(1, Math.hypot(dx, dy) / 34);
        particles.push({ x, y, vx: dx * .07, vy: dy * .07, age: 0, life: 700 + Math.random() * 420, size: 2 + sp * 2.6 });
        if (particles.length > MAX_P) particles.shift();
      }

      function drawRipple(rp, now) {
        const t = (now - rp.born) / DURATION;
        if (t >= 1) return false;
        const r = Math.max(1, MAX_R * (1 - Math.pow(1 - t, 3)));
        const a = rp.s * Math.pow(1 - t, 2.2);           // 消散曲线 ≈ 速度场每帧衰减
        if (a <= .012) return false;
        // 模糊波纹：无硬边光圈，仅柔光扩散（中心偏暗，避免亮斑）
        const g = ctx.createRadialGradient(rp.x, rp.y, 0, rp.x, rp.y, r);
        g.addColorStop(0, `rgba(255,255,255,${(a * .26).toFixed(3)})`);
        g.addColorStop(.5, `rgba(255,255,255,${(a * .1).toFixed(3)})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, r, 0, 6.2832); ctx.fill();
        // 淡绿柔光外圈
        const fg = ctx.createRadialGradient(rp.x, rp.y, r * .3, rp.x, rp.y, r);
        fg.addColorStop(0, 'rgba(47,112,96,0)');
        fg.addColorStop(1, `rgba(47,112,96,${(a * .07).toFixed(3)})`);
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, r, 0, 6.2832); ctx.fill();
        return true;
      }

      function frame(ts) {
        const dt = Math.min(120, ts - (lastTs || ts));
        lastTs = ts;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ripples = ripples.filter(rp => drawRipple(rp, ts));
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.age += dt;
          if (p.age >= p.life) { particles.splice(i, 1); continue; }
          const k = 1 - p.age / p.life;                  // 尾迹 0.7~1.1s 内消散（对应 0.98 速度场衰减）
          // 柔雾光点：无中心亮斑、无拉丝，均匀淡光渐隐
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3.2);
          g.addColorStop(0, `rgba(247,215,148,${(k * .13).toFixed(3)})`);
          g.addColorStop(.7, `rgba(247,215,148,${(k * .08).toFixed(3)})`);
          g.addColorStop(1, 'rgba(247,215,148,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3.2, 0, 6.2832); ctx.fill();
        }
        rafId = requestAnimationFrame(frame);
      }

      addEventListener('pointermove', e => {
        const x = e.clientX, y = e.clientY;
        if (!running) return;
        if (lastPoint) {
          const dx = x - lastPoint.x, dy = y - lastPoint.y;
          const d = Math.hypot(dx, dy);
          distAcc += d;
          if (distAcc >= TRAIL_STEP) {
            const n = Math.floor(distAcc / TRAIL_STEP);
            for (let i = 0; i < n; i++) {
              const f = n === 1 ? 1 : i / (n - 1);
              spawnParticle(lastPoint.x + dx * f, lastPoint.y + dy * f, dx, dy);
            }
            distAcc %= TRAIL_STEP;
          }
          rippleAcc += d;                                 // 移动中激起波纹，静止时不自动生成
          if (rippleAcc >= RIPPLE_DIST) { spawnRipple(x, y, .85); rippleAcc = 0; }
        } else {
          rippleAcc = 0; distAcc = 0;
        }
        lastPoint = { x, y };
      }, { passive: true });

      if (!reduced) {
        // 编辑弹窗打开时暂停特效，关闭后恢复
        new MutationObserver(() => {
          const was = running;
          running = !modal.classList.contains('open');
          if (was && !running) ctx.clearRect(0, 0, innerWidth, innerHeight);
        }).observe(modal, { attributes: true, attributeFilter: ['class'] });
        rafId = requestAnimationFrame(frame);
      }
    })();

    /* ========== 背景视差：鼠标移动时自然场景缓慢跟随（模拟 3D 场景拖动感） ========== */
    (() => {
      const layers = [
        ['px-sun', 8, 6], ['px-mist1', 16, 11], ['px-mist2', 14, 9],
        ['px-far', 20, 14], ['px-mid', 32, 22], ['px-near', 46, 30]
      ].map(([cls, dx, dy]) => ({ el: document.querySelector('.' + cls), dx, dy, cx: 0, cy: 0 }));
      let tx = 0, ty = 0, lastTs = 0, rafId = null;
      const enabled = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      function frame(ts) {
        if (!enabled) return;
        const dt = Math.min(120, ts - (lastTs || ts));
        lastTs = ts;
        const k = 1 - Math.exp(-5 * dt / 1000);     // 帧率无关指数阻尼：缓慢跟随、不跟手
        for (const l of layers) {
          l.cx += (tx * l.dx - l.cx) * k;
          l.cy += (ty * l.dy - l.cy) * k;
          if (l.cx || l.cy) l.el.style.transform = `translate3d(${l.cx.toFixed(2)}px, ${l.cy.toFixed(2)}px, 0)`;
        }
        rafId = requestAnimationFrame(frame);
      }
      window.addEventListener('pointermove', e => {
        tx = (e.clientX / window.innerWidth - .5) * 2;
        ty = (e.clientY / window.innerHeight - .5) * 2;
      }, { passive: true });
      window.addEventListener('pointerleave', () => { tx = 0; ty = 0; });   // 鼠标离开视口时缓慢回中
      rafId = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
